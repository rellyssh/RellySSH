name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            artifact_pattern: dist-release/*.AppImage dist-release/*.deb dist-release/*.rpm
          - os: windows-latest
            name: windows
            artifact_pattern: dist-release/*.exe
          - os: macos-latest
            name: macos
            artifact_pattern: dist-release/*.dmg dist-release/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build frontend & Electron
        run: npm run build

      - name: Package native bundles with electron-builder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish never

      - name: Compute SHA256 checksums (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist-release
          sha256sum *.{AppImage,deb,rpm,dmg,zip} > SHA256SUMS.txt 2>/dev/null || true

      - name: Compute SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist-release
          Get-FileHash -Algorithm SHA256 *.exe | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 SHA256SUMS-win.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rellyssh-${{ matrix.name }}
          path: |
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/SHA256SUMS*.txt

  publish-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize release files
        run: |
          mkdir -p final-release
          find release-assets -type f -exec mv {} final-release/ \;
          ls -la final-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
